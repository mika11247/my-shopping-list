services:
  db:
    image: public.ecr.aws/supabase/postgres:17.12.0.002
    user: postgres
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        initdb -D /tmp/withdrawal-db -A trust
        pg_ctl -D /tmp/withdrawal-db -w start
        psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role bypassrls; create schema auth;"
        pg_ctl -D /tmp/withdrawal-db -m fast stop
        printf 'host all all samenet trust\n' >> /tmp/withdrawal-db/pg_hba.conf
        umask 077
        head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /tmp/withdrawal-db/vault-test.key
        printf '%s\n' '#!/bin/sh' 'cat /tmp/withdrawal-db/vault-test.key' > /tmp/withdrawal-db/vault-getkey
        chmod 700 /tmp/withdrawal-db/vault-getkey
        exec postgres -D /tmp/withdrawal-db -h 0.0.0.0 \
          -c shared_preload_libraries=supautils,pg_cron,pg_net,supabase_vault \
          -c vault.getkey_script=/tmp/withdrawal-db/vault-getkey \
          -c 'supautils.policy_grants={"withdrawal_storage_operator":["storage.objects"]}' \
          -c app.withdrawal_cron_allow_isolated_http=on \
          -c cron.database_name=postgres
    healthcheck:
      test: [CMD, pg_isready, -h, db]
      interval: 1s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.198.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: http://127.0.0.1:35531
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres@db:5432/postgres?sslmode=disable&search_path=auth,public
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://127.0.0.1:35530
      GOTRUE_JWT_SECRET: withdrawal-isolated-test-signing-secret
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    ports:
      - 127.0.0.1:35531:9999
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.6
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: withdrawal-isolated-test-signing-secret
      PGRST_SERVER_PORT: 3000
    ports:
      - 127.0.0.1:35532:3000
  storage:
    image: public.ecr.aws/supabase/storage-api:v1.98.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres@db:5432/postgres
      DB_INSTALL_ROLES: "true"
      AUTH_JWT_SECRET: withdrawal-isolated-test-signing-secret
      PGRST_JWT_SECRET: withdrawal-isolated-test-signing-secret
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /tmp/fixture-images
      TENANT_ID: withdrawal-isolated
      REGION: local
      GLOBAL_S3_BUCKET: local
    ports:
      - 127.0.0.1:35535:5000
  gateway:
    image: haproxy:3.2.26-alpine
    depends_on: [auth, rest, storage]
    volumes:
      - ./account-withdrawal.haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - 127.0.0.1:35539:8080
    networks: [default, loopback]
networks:
  default:
    internal: true
  loopback:
