defaults
  mode http
  timeout connect 3s
  timeout client 30s
  timeout server 30s

frontend supabase
  bind :8080
  use_backend auth if { path_beg /auth/v1/ }
  use_backend rest if { path_beg /rest/v1/ }
  use_backend storage if { path_beg /storage/v1/ }
  http-request deny unless { path_beg /auth/v1/ /rest/v1/ /storage/v1/ }

backend auth
  http-request replace-path ^/auth/v1/(.*)$ /\1
  server auth auth:9999

backend rest
  http-request replace-path ^/rest/v1/(.*)$ /\1
  server rest rest:3000

backend storage
  http-request replace-path ^/storage/v1/(.*)$ /\1
  server storage storage:5000
